name: Website and public releases
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional public release tag to download and verify before deployment'
        required: false
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Exact published Claude Eden release to verify and deploy
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: website-${{ github.event_name }}-${{ inputs.release_tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: (github.event_name == 'release' && !github.event.release.draft) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Tags can predate this workflow. The verification tools live on main.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download public assets and verify SHA-256
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/run-in-workspace.mjs -- node www/scripts/sync-release.mjs --tag "$RELEASE_TAG" --output .tmp/release.json --archive-directory .tmp/release
  build:
    needs: verify-release
    if: always() && !cancelled() && (needs.verify-release.result == 'success' || needs.verify-release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && 'main' || github.ref }}
          persist-credentials: false
      - uses: ./.github/actions/build-website
        with:
          release_tag: ${{ inputs.release_tag || github.event.release.tag_name }}

  deploy:
    needs: build
    if: always() && needs.build.result == 'success' && (github.event_name == 'workflow_dispatch' || github.event_name == 'release') && (github.ref == 'refs/heads/main' || github.event_name == 'release')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
