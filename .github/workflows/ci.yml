name: Windows desktop and Linux guest checks
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: eden-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  workspace-runner:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Workspace paths, cancellation, real Go cache and telemetry
        run: node scripts/run-in-workspace.mjs -- node --test scripts/run-in-workspace.test.mjs scripts/prepare-lima-templates.test.mjs
      - name: Go path checker regressions
        run: node scripts/run-in-workspace.mjs -- go test ./scripts/check-test-paths
      - name: Shared guest identity and catalog
        run: node scripts/run-in-workspace.mjs --cwd shared/guestidentity -- go test ./...
      - name: Build the Windows installation helper for inventory tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .tmp/tools -Force | Out-Null
          node scripts/run-in-workspace.mjs -- go build -trimpath -o .tmp/tools/eden-install.exe ./cmd/eden-install
      - name: Cleanup inventory, payload hashes and Windows helper integration
        run: node scripts/run-in-workspace.mjs -- node --test scripts/generate-windows-cleanup.test.mjs
  workflow-checks:
    needs: workspace-runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Version consistency and release safety tests
        run: |
          node scripts/run-in-workspace.mjs -- node scripts/check-repository-files.mjs
          node scripts/run-in-workspace.mjs -- node scripts/check-version.mjs
          node scripts/run-in-workspace.mjs -- node --test scripts/release-version.test.mjs scripts/release-control.test.mjs scripts/prepare-release-assets.test.mjs scripts/esigner.test.mjs scripts/contribution-invite.test.mjs scripts/issue-system-labels.test.mjs
          node scripts/run-in-workspace.mjs -- pwsh -NoProfile -File scripts/test-windows-signing.ps1
      - name: Validate workflow syntax
        run: node scripts/run-in-workspace.mjs -- go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.11 -color
  windows-updates:
    needs: workflow-checks
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') && '["windows-2025", "windows-2022"]' || '["windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install the verified NSIS compiler
        run: node scripts/run-in-workspace.mjs -- pwsh -NoProfile -File scripts/install-nsis.ps1
      - name: Prepare the pinned desktop resource tool
        run: node scripts/run-in-workspace.mjs -- node scripts/prepare-desktop.mjs --resources
      - name: Disposable system integration — install verified WebView2
        run: |
          node scripts/run-in-workspace.mjs -- pwsh -NoProfile -Command @'
          . ./scripts/windows-common.ps1
          $dependency = (Get-Content packaging/windows/dependencies.json -Raw | ConvertFrom-Json).webview2
          $cache = Join-Path $env:RUNNER_TEMP 'update-dependencies'
          $runtime = Get-VerifiedDependency $dependency $cache
          $signature = Get-AuthenticodeSignature -LiteralPath $runtime
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') { throw 'WebView2 prerequisite signature is not trusted.' }
          $start = [Diagnostics.ProcessStartInfo]::new($runtime)
          $start.UseShellExecute = $false
          $start.WorkingDirectory = $cache
          $start.ArgumentList.Add('/silent'); $start.ArgumentList.Add('/install')
          $process = [Diagnostics.Process]::Start($start)
          try {
            if (!$process.WaitForExit(180000)) { $process.Kill($true); throw 'WebView2 prerequisite installation timed out.' }
            if ($process.ExitCode -ne 0) { throw "WebView2 prerequisite failed: $($process.ExitCode)" }
          } finally { $process.Dispose() }
          '@
      - name: Disposable system integration — certificates, update and rollback
        run: |
          node scripts/run-in-workspace.mjs -- pwsh -NoProfile -Command @'
          $env:GOROOT = (go env GOROOT).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the selected Go toolchain.' }
          & scripts/test-windows-update-flow.ps1 -DisposableMachine
          '@
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: updater-${{ matrix.os }}-reports
          path: .tmp/eden-smoke-update-*.json
          if-no-files-found: ignore
  windows:
    needs: workflow-checks
    uses: ./.github/workflows/windows-build.yml
    with:
      ref: ${{ github.sha }}
      release: false
      artifact_name: eden-windows-amd64-test
      all_windows_versions: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
  linux-guest:
    needs: workflow-checks
    uses: ./.github/workflows/linux-guest.yml
    with:
      ref: ${{ github.sha }}
