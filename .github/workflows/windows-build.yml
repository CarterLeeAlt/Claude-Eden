name: Reusable Windows build and installer
on:
  workflow_call:
    inputs:
      ref:
        description: Exact 40-character commit SHA to build
        required: true
        type: string
      release:
        description: Require trusted signing and reviewed corresponding sources
        type: boolean
        default: false
      artifact_name:
        description: Release artifact name, or development artifact prefix
        required: true
        type: string
      all_windows_versions:
        description: Also test the development package on Windows Server 2022
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  development:
    if: ${{ !inputs.release }}
    strategy:
      fail-fast: false
      matrix:
        # windows-2025 produces the test package. The older image repeats
        # the same suite, so ordinary branch pushes leave it out.
        os: ${{ fromJSON(inputs.all_windows_versions && '["windows-2025", "windows-2022"]' || '["windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read the package version
        id: version
        run: '"version=$((Get-Content VERSION -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - uses: ./.github/actions/windows-toolchain
        with:
          # Rehearse the release-only source collection on every change, so
          # it cannot first fail while a release is waiting.
          corresponding-sources: ${{ matrix.os == 'windows-2025' }}
      - name: Disposable system integration — build, test, install and uninstall
        env:
          EDEN_BUILD_REF: ${{ inputs.ref }}
          EDEN_TEST_STORAGE_VOLUME: C:\Eden-CI-Storage\${{ github.run_id }}-${{ github.run_attempt }}
        run: node scripts/run-in-workspace.mjs -- pwsh -NoProfile -File scripts/ci-windows-build.ps1 -SystemIntegration
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}
          path: _output/releases/${{ steps.version.outputs.version }}/windows/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve failed unsigned candidates for installation debugging
        if: ${{ always() && job.status != 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-failed-candidate
          path: |
            _output/windows-amd64/app/**
            _output/releases/*/windows/Eden-*-windows-amd64-setup-unsigned.exe
            _output/releases/*/windows/SHA256SUMS
          if-no-files-found: ignore
          compression-level: 0
          overwrite: true
          retention-days: 14
      - name: Preserve public test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-${{ matrix.os }}-reports
          path: |
            .tmp/eden-smoke-*.json
            .tmp/eden-build-ui-*/smoke.json
            .tmp/eden-build-ui-*/*.png
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
  release:
    if: ${{ inputs.release }}
    runs-on: windows-2025
    environment: eden-release
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read the package version
        id: version
        run: '"version=$((Get-Content VERSION -Raw).Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8'
      - uses: ./.github/actions/windows-toolchain
        with:
          corresponding-sources: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Disposable system integration — sign, install, update and uninstall
        env:
          EDEN_BUILD_REF: ${{ inputs.ref }}
          EDEN_TEST_STORAGE_VOLUME: C:\Eden-CI-Storage\${{ github.run_id }}-${{ github.run_attempt }}
          EDEN_WINDOWS_SIGNING_PROVIDER: ${{ vars.EDEN_WINDOWS_SIGNING_PROVIDER }}
          EDEN_ESIGNER_USERNAME: ${{ secrets.EDEN_ESIGNER_USERNAME }}
          EDEN_ESIGNER_PASSWORD: ${{ secrets.EDEN_ESIGNER_PASSWORD }}
          EDEN_ESIGNER_CREDENTIAL_ID: ${{ secrets.EDEN_ESIGNER_CREDENTIAL_ID }}
          EDEN_ESIGNER_CERTIFICATE_SERIAL: ${{ vars.EDEN_ESIGNER_CERTIFICATE_SERIAL }}
          EDEN_ESIGNER_TOTP_SECRET: ${{ secrets.EDEN_ESIGNER_TOTP_SECRET }}
          EDEN_WINDOWS_PFX_BASE64: ${{ secrets.EDEN_WINDOWS_PFX_BASE64 }}
          EDEN_WINDOWS_PFX_PASSWORD: ${{ secrets.EDEN_WINDOWS_PFX_PASSWORD }}
        run: node scripts/run-in-workspace.mjs -- pwsh -NoProfile -File scripts/ci-windows-build.ps1 -Release -SystemIntegration
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            _output/releases/${{ steps.version.outputs.version }}/windows/Eden-*-windows-amd64-setup.exe
            _output/releases/${{ steps.version.outputs.version }}/windows/SHA256SUMS
            _output/releases/${{ steps.version.outputs.version }}/windows/mihomo-*-source.tar.gz
            _output/releases/${{ steps.version.outputs.version }}/windows/qemu-*-source.tar.gz
            _output/releases/${{ steps.version.outputs.version }}/windows/qemu-*-windows-full-source.*
            _output/releases/${{ steps.version.outputs.version }}/windows/build-metadata.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14
      - name: Preserve public release acceptance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}-reports
          path: |
            .tmp/eden-smoke-*.json
            .tmp/eden-build-ui-*/smoke.json
            .tmp/eden-build-ui-*/*.png
          if-no-files-found: ignore
          retention-days: 14
      # The caller owns publication. This workflow has no repository write access.
